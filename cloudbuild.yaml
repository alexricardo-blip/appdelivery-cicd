steps:
  - name: 'python:3.12-slim'
    entrypoint: 'python'
    args: ['-m', 'unittest', 'discover', '-s', 'tests', '-v']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west4-docker.pkg.dev/$PROJECT_ID/appdelivery-repo/appdelivery:$BUILD_ID'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west4-docker.pkg.dev/$PROJECT_ID/appdelivery-repo/appdelivery:$BUILD_ID'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'appdelivery'
      - '--image'
      - 'europe-west4-docker.pkg.dev/$PROJECT_ID/appdelivery-repo/appdelivery:$BUILD_ID'
      - '--region'
      - 'europe-west4'
      - '--no-traffic'

options:
  logging: CLOUD_LOGGING_ONLY
